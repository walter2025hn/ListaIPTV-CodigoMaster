name: Actualizar Lista de Canales

on:
  schedule:
    - cron: '0 0 * * *' # Ejecuta todos los días a medianoche UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Ejecutar script extractor
      run: python extractor.py

    - name: Guardar y hacer Push en GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add lista_canales.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Lista de canales actualizada" && git push)
